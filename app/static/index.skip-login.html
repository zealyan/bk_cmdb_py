<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CMDB Dev - Skip Login</title>
    <script>
      (function () {
        if (window.location.protocol.startsWith('https')) {
          var meta = document.createElement('meta')
          meta.setAttribute('http-equiv', 'Content-Security-Policy')
          meta.setAttribute('content', 'upgrade-insecure-requests')
          document.head.appendChild(meta)
        }
      })();
    </script>
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div id="app"></div>
    <script type="text/javascript">
        window.Site = {
            url: "http://localhost:9090/proxy/",
            version: "v3",
            login: "",
            agent: "",
            authscheme: "internal",
            buildVersion: "dev-skip-login",
            fullTextSearch: "off",
            helpDocUrl: null,
            disableOperationStatistic: false
        }
        window.User = {
            admin: 1,
            name: "admin",
            display_name: "Administrator"
        }
        window.Supplier = {
            account: '0'
        }
        window.ESB = {
          userManage: ""
        }
        window.API_HOST = "http://localhost:9090/proxy/"
        window.API_PREFIX = API_HOST + 'api/' + Site.version
    </script>
  </body>
</html>
