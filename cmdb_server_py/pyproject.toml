[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bk-cmdb-py"
version = "0.1.0"
description = "BK-CMDB Python Backend Implementation"
requires-python = ">=3.10, <3.15"
authors = [
    { name = "BK-CMDB Team" }
]
dependencies = [
    "Flask>=2.3.0, <3.0.0",
    "Flask-Cors>=4.0.0, <5.0.0",
    "Flask-SQLAlchemy>=3.1.0, <4.0.0",
    "pymongo>=4.3.0, <5.0.0",
    "SQLAlchemy>=2.0.0, <3.0.0",
    "mongoengine>=0.28.0, <1.0.0",
    "py-pglite>=0.5.0, <1.0.0",
    "python-dotenv>=1.0.0, <2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "migrate*"]
