<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CMDB Dev</title>
    <script>
      (function () {
        // 直调PaaS接口时，如果本平台为https,PaaS为http，则需要在head中声明如下的meta才能避免被csp拦截
        if (window.location.protocol.startsWith('https')) {
          var meta = document.createElement('meta')
          meta.setAttribute('http-equiv', 'Content-Security-Policy')
          meta.setAttribute('content', 'upgrade-insecure-requests')
          document.head.appendChild(meta)
        }
      })();
    </script>

    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div id="app"></div>
    <!-- built files will be auto injected -->
    <script type="text/javascript">
        window.Site = {
            url: "http://localhost:8080/proxy/",
            version: "v3",
            login: "",
            agent: "",
            authscheme: "internal",
            buildVersion: "dev",
            fullTextSearch: "off",
            helpDocUrl: null,
            disableOperationStatistic: false
        }
        window.User = {
            admin: 1,
            name: "admin"
        }
        window.Supplier = {
            account: '0'
        }
        window.ESB = {
          userManage: "http://localhost:8080/api/c/compapi/v2/usermanage/fs_list_users/"
        }
        // 使用代理地址
        window.API_HOST = "http://localhost:8080/proxy/"
        window.API_PREFIX = API_HOST + 'api/' + Site.version
    </script>
  </body>
</html>
